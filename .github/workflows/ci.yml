name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run skill linter
        run: python3 scripts/lint_skills.py

      - name: Run verification suite
        run: python3 scripts/verify.py

      - name: Run publish check (clean tree)
        if: runner.os != 'Windows'
        run: python3 scripts/publish_check.py --allow-dirty

      - name: Run node tests
        run: node --test tests/npm.test.mjs

      - name: Test npm pack dry-run
        run: npm pack --dry-run --ignore-scripts
